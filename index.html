    <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 z-40 flex flex-col bg-navy-900 text-slate-300" aria-label="Main navigation">
      <div class="flex items-center gap-3 h-16 px-4 border-b border-white/10 shrink-0">
        <div id="brand-mark" class="brand-mark" aria-hidden="true">N</div>
        <div class="sidebar-label leading-tight min-w-0">

      <header class="sticky top-0 z-20 h-16 bg-white/95 backdrop-blur border-b border-slate-200 flex items-center gap-3 px-4 lg:px-6">

          <div id="search-results" class="dropdown-panel absolute left-0 right-0 top-12 hidden max-h-[420px] overflow-y-auto"></div>
        </div>
        <div class="ml-auto flex items-center gap-1.5">
          <div class="relative hidden sm:block">
            <button id="btn-quick-new" class="btn btn-primary h-10"><i data-lucide="plus"></i><span class="hidden md:inline">New</span></button>
            <div id="quick-new-menu" class="dropdown-panel absolute right-0 top-12 w-56 hidden py-1.5"></div>
          </div>
          <div class="relative">
            <button id="btn-notifications" class="icon-btn relative" aria-label="Notifications"><i data-lucide="bell"></i><span id="notif-count" class="notif-dot hidden"></span></button>
            <div id="notif-panel" class="dropdown-panel absolute right-0 top-12 w-[340px] max-w-[calc(100vw-2rem)] hidden"></div>

              <span class="w-8 h-8 rounded-full bg-navy-800 text-white grid place-items-center text-xs font-bold">SA</span>
              <span class="hidden md:block text-left leading-tight">
                <span class="block text-sm font-semibold text-slate-800">Sara Al Amiri</span>
                <span class="block text-[11px] text-slate-500">Finance Manager</span>
              </span>
              <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 hidden md:block"></i>
            </button>
            <div id="profile-panel" class="dropdown-panel absolute right-0 top-12 w-64 hidden py-1.5"></div>
          </div>
        </div>
      </header>

      <main id="view" class="flex-1 px-4 lg:px-8 py-6 w-full max-w-[1500px] mx-auto" tabindex="-1"></main>
